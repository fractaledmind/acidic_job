name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.3.4
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4"]
        gemfile: [ rails_7_1, rails_7_2, rails_8_0, rails_main ]
        database: [ mysql, postgres, sqlite ]
        exclude:
          - ruby: "3.0"
            gemfile: rails_7_2
          - ruby: "3.0"
            gemfile: rails_8_0
          - ruby: "3.0"
            gemfile: rails_main
          - ruby: "3.1"
            gemfile: rails_8_0
          - ruby: "3.1"
            gemfile: rails_main
          - ruby: "3.2"
            gemfile: rails_main

    # No Docker service containers: use the database servers pre-installed on the
    # GitHub-hosted runner instead, so CI never pulls images from Docker Hub
    # (which was an intermittent source of "Initialize containers" failures).
    env:
      TARGET_DB: ${{ matrix.database }}
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.gemfile }}.gemfile
      # Point at the runner's pre-installed Postgres/MySQL (overrides the
      # docker-compose defaults in test/dummy/config/database.yml).
      POSTGRES_PORT: 5432
      POSTGRES_PASSWORD: postgres
      MYSQL_PORT: 3306
      MYSQL_PASSWORD: root

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Start database server
        run: |
          case "${{ matrix.database }}" in
            postgres)
              sudo systemctl start postgresql
              sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
              ;;
            mysql)
              sudo systemctl start mysql
              ;;
          esac

      - name: Setup test database
        run: |
          bin/rails db:setup

      - name: Run the tests
        run: bin/rails test
        timeout-minutes: 5

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-ruby${{ matrix.ruby }}-${{ matrix.gemfile }}-${{ matrix.database }}
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest

    env:
      TARGET_DB: sqlite
      COVERAGE: 1
      COVERAGE_CHECK: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Setup test database
        run: |
          bin/rails db:setup

      - name: Run tests with coverage
        run: bin/rails test
        timeout-minutes: 10

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
